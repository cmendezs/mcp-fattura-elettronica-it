[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-fattura-elettronica-it"
version = "0.6.1"
description = "MCP server for Italian e-invoicing — FatturaPA XML / SDI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Christophe Mendez", email = "christophe@mzconsultants.eu" }]
keywords = ["mcp", "fattura-elettronica", "fatturapa", "sdi", "agenzia-entrate", "b2b", "b2g"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    "mcp-einvoicing-core>=1.16.1,<2.0.0",
    "fastmcp>=2.0.0",
    "lxml>=5.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "lxml-stubs>=0.5.0",
    "pre-commit>=4.5.1",
]

[project.scripts]
mcp-fattura-elettronica-it = "mcp_fattura_elettronica_it.server:main"

[project.urls]
Homepage = "https://github.com/cmendezs/mcp-fattura-elettronica-it"
Repository = "https://github.com/cmendezs/mcp-fattura-elettronica-it"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_fattura_elettronica_it"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    ".env*",
    ".DS_Store",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=mcp_fattura_elettronica_it --cov-report=term-missing"

[tool.coverage.run]
source = ["mcp_fattura_elettronica_it"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"
